name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: Проверка синтаксиса
        run: for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f"; done

      - name: Тесты
        run: npm test
        env:
          CI: true
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/familyflow_test
